readme = "README.md"
authors = [
    { name = "rhawk117", email = "hawkinsry19@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
credent = "credent:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
